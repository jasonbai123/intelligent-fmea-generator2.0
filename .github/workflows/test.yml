name: 自动化测试

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # 每天凌晨2点运行
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  # 前端单元测试
  unit-tests:
    name: 前端单元测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm run test:unit -- --reporter=verbose

      - name: 生成覆盖率报告
        run: npm run test:coverage

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: test-results/

  # E2E测试 - Chrome
  e2e-tests-chrome:
    name: E2E测试 (Chrome)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 安装Playwright浏览器
        run: npx playwright install --with-deps chromium

      - name: 运行E2E测试 (Chrome)
        run: npm run test:e2e -- --project=chromium

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-chrome
          path: playwright-report/
          retention-days: 30

  # E2E测试 - Firefox
  e2e-tests-firefox:
    name: E2E测试 (Firefox)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 安装Playwright浏览器
        run: npx playwright install --with-deps firefox

      - name: 运行E2E测试 (Firefox)
        run: npm run test:e2e -- --project=firefox

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-firefox
          path: playwright-report/
          retention-days: 30

  # E2E测试 - Safari (WebKit)
  e2e-tests-webkit:
    name: E2E测试 (Safari)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 安装Playwright浏览器
        run: npx playwright install --with-deps webkit

      - name: 运行E2E测试 (Safari)
        run: npm run test:e2e -- --project=webkit

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 30

  # 移动端测试
  mobile-tests:
    name: 移动端测试
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 安装Playwright浏览器
        run: npx playwright install --with-deps

      - name: 运行移动端测试
        run: npm run test:e2e -- tests/e2e/mobile.spec.ts

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 30

  # API测试
  api-tests:
    name: API接口测试
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      # 后端服务
      backend:
        image: node:18
        ports:
          - 3001:3001
        options: >-
          --health-cmd "curl http://localhost:3001/api/health"
          --health-interval 10s
          --health-timeout 30s
          --health-retries 3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 启动后端服务
        working-directory: ./backend
        env:
          PORT: 3001
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          npm install
          npm run build &
          sleep 10

      - name: 等待后端启动
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3001/api/health; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: 运行API测试
        env:
          VITE_API_BASE_URL: http://localhost:3001
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run test:api || true

      - name: 上传API测试结果
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api-test-results
          path: test-results/

  # 性能测试
  performance-tests:
    name: 性能测试
    runs-on: ubuntu-latest
    needs: e2e-tests-chrome

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 安装Playwright浏览器
        run: npx playwright install --with-deps

      - name: 运行Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true

  # 构建测试
  build-tests:
    name: 构建测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 检查构建输出
        run: |
          if [ ! -d "docs" ]; then
            echo "构建失败：docs目录不存在"
            exit 1
          fi
          echo "构建成功"
          ls -lh docs

      - name: 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: docs/
          retention-days: 7

  # 测试报告汇总
  test-summary:
    name: 测试报告汇总
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests-chrome, e2e-tests-firefox, e2e-tests-webkit, mobile-tests, api-tests, build-tests]
    if: always()

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有测试报告
        uses: actions/download-artifact@v3
        with:
          path: test-results/

      - name: 生成测试汇总报告
        run: |
          echo "# 测试执行报告" > test-summary.md
          echo "" >> test-summary.md
          echo "## 执行时间" >> test-summary.md
          echo "- 开始: $(date -u +'%Y-%m-%d %H:%M:%S')" >> test-summary.md
          echo "" >> test-summary.md
          echo "## 测试状态" >> test-summary.md
          echo "- 单元测试: ${{ needs.unit-tests.result }}" >> test-summary.md
          echo "- E2E测试 (Chrome): ${{ needs.e2e-tests-chrome.result }}" >> test-summary.md
          echo "- E2E测试 (Firefox): ${{ needs.e2e-tests-firefox.result }}" >> test-summary.md
          echo "- E2E测试 (Safari): ${{ needs.e2e-tests-webkit.result }}" >> test-summary.md
          echo "- 移动端测试: ${{ needs.mobile-tests.result }}" >> test-summary.md
          echo "- API测试: ${{ needs.api-tests.result }}" >> test-summary.md
          echo "- 构建测试: ${{ needs.build-tests.result }}" >> test-summary.md

      - name: 上传测试汇总
        uses: actions/upload-artifact@v3
        with:
          name: test-summary
          path: test-summary.md

      - name: 发送测试结果通知
        if: contains(needs.*.result, 'failure')
        run: |
          echo "有测试失败！请检查测试报告。"
          exit 1

  # 自动部署到测试环境（仅在main分支且所有测试通过时）
  deploy-staging:
    name: 部署到测试环境
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests-chrome, mobile-tests, build-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: staging
      url: https://intelligent-fmea-generator-staging.pages.dev

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 部署到Cloudflare Pages
        run: npm run deploy:pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 运行烟雾测试
        run: |
          curl -f https://intelligent-fmea-generator-staging.pages.dev || exit 1

      - name: 部署成功
        run: echo "🚀 成功部署到测试环境"
